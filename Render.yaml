
databases:
  - name: tell-news-db
    plan: free
    region: frankfurt
    databaseName: tellnews
    user: tellnews_user

services:
  - type: web
    name: tell-news-backend
    runtime: go
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: go build -o app .
    startCommand: ./app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tell-news-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true